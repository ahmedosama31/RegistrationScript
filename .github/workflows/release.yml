name: Build & Release

on:
  push:
    tags:
      - 'v*'          # triggers on v0.1.0, v1.2.3, etc.

permissions:
  contents: write     # needed to create GitHub releases

jobs:
  # ── Full build: includes ddddocr + onnxruntime for auto CAPTCHA solving ──────
  build-full:
    name: Build Full (with auto-CAPTCHA)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (full)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ocr.txt
          pip install pyinstaller

      - name: Build EXEs (full, API, and visible-click)
        shell: pwsh
        run: |
          $specs = @(
            "RegistrationBOT.spec",
            "RegistrationBOT-api.spec",
            "RegistrationBOT-visible.spec"
          )
          foreach ($spec in $specs) {
            python -m PyInstaller --clean --noconfirm $spec
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify full EXEs exist
        shell: pwsh
        run: |
          $executables = @(
            "dist\registrationscript.exe",
            "dist\registrationscript-api.exe",
            "dist\registrationscript-visible.exe"
          )
          foreach ($executable in $executables) {
            if (!(Test-Path $executable)) {
              Write-Error "$executable not found after build!"
              exit 1
            }
            Write-Host "$executable size: $((Get-Item $executable).length / 1MB) MB"
          }

      - name: Upload full EXEs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-exes
          path: |
            dist/registrationscript.exe
            dist/registrationscript-visible.exe
            dist/registrationscript-api.exe

  # ── Lite build: no ddddocr/onnxruntime, much smaller, manual CAPTCHA only ───
  build-lite:
    name: Build Lite (manual CAPTCHA, smaller)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (lite – no ddddocr)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (lite)
        run: python -m PyInstaller --clean --noconfirm RegistrationBOT-lite.spec

      - name: Verify EXE exists
        run: |
          if (!(Test-Path "dist\registrationscript-lite.exe")) {
            Write-Error "Lite EXE not found after build!"
            exit 1
          }
          Write-Host "Lite EXE size: $((Get-Item 'dist\registrationscript-lite.exe').length / 1MB) MB"

      - name: Upload lite EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lite-exe
          path: dist/registrationscript-lite.exe

  # ── Publish: create one GitHub Release with all four EXEs attached ──────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-full, build-lite]

    steps:
      - name: Download full EXEs
        uses: actions/download-artifact@v4
        with:
          name: full-exes
          path: release-files

      - name: Download lite EXE
        uses: actions/download-artifact@v4
        with:
          name: lite-exe
          path: release-files

      - name: Calculate EXE sizes
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os

          files = {
              "NORMAL_EXE_SIZE": "release-files/registrationscript.exe",
              "LITE_EXE_SIZE": "release-files/registrationscript-lite.exe",
              "VISIBLE_EXE_SIZE": "release-files/registrationscript-visible.exe",
              "API_EXE_SIZE": "release-files/registrationscript-api.exe",
          }

          for env_name, path in files.items():
              size_mb = os.path.getsize(path) / (1024 * 1024)
              print(f"{env_name}={size_mb:.1f} MB")
          PY

      - name: Create GitHub Release and upload all four EXEs
        uses: softprops/action-gh-release@v2
        with:
          name: "RegistrationScript ${{ github.ref_name }}"
          body: |
            ## RegistrationScript ${{ github.ref_name }}

            ### Which download should I pick?

            | File | Size | CAPTCHA | What it does |
            |---|---|---|---|
            | `registrationscript.exe` | ${{ env.NORMAL_EXE_SIZE }} | Automatic OCR + SIS validation | Standard version. Opens Chrome for login and registration monitoring, then submits the selected schedule. |
            | `registrationscript-lite.exe` | ${{ env.LITE_EXE_SIZE }} | Manual entry + SIS validation | Smaller standard version without the OCR model. You type the CAPTCHA shown by SIS. |
            | `registrationscript-visible.exe` | ${{ env.VISIBLE_EXE_SIZE }} | Student completes it manually in Chrome | Visible handoff version. Chrome rapidly clicks and highlights every selected lecture/tutorial, then the bot stops without submitting. |
            | `registrationscript-api.exe` | ${{ env.API_EXE_SIZE }} | Automatic OCR + SIS validation | Direct API version. Uses the SIS HTTP/Ext.NET endpoints without opening Chrome. |

            ### Quick Start (Windows – no Python needed)
            1. Download one of the four EXEs above to a normal writable folder.
            2. Double-click the EXE (or run it from a terminal).
            3. The first run asks for your SIS Student ID and password and saves them locally for later runs.

            **Runtime requirement:** Windows 10/11 and internet access to SIS. The normal, lite, and visible versions require Google Chrome; the direct API version does not open Chrome. Python and pip are not required.

            ### What's new
            See the [commit history](../../commits/${{ github.ref_name }}) for details.

            > **Disclaimer:** Use only on accounts you are authorised to access and in compliance with your institution's policies.
          files: |
            release-files/registrationscript.exe
            release-files/registrationscript-lite.exe
            release-files/registrationscript-visible.exe
            release-files/registrationscript-api.exe
          draft: false
          prerelease: false
