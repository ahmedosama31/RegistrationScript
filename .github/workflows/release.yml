name: Build & Release

on:
  push:
    branches:
      - 'codex/macos-release' # temporary validation branch; removed after CI passes
    tags:
      - 'v*'          # triggers on v0.1.0, v1.2.3, etc.

permissions:
  contents: write     # needed to create GitHub releases

jobs:
  # ── Full build: includes ddddocr + onnxruntime for auto CAPTCHA solving ──────
  build-full:
    name: Build Full (with auto-CAPTCHA)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (full)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ocr.txt
          pip install pyinstaller

      - name: Build EXEs (full, API, and visible-click)
        shell: pwsh
        run: |
          $specs = @(
            "RegistrationBOT.spec",
            "RegistrationBOT-api.spec",
            "RegistrationBOT-visible.spec"
          )
          foreach ($spec in $specs) {
            python -m PyInstaller --clean --noconfirm $spec
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify full EXEs exist
        shell: pwsh
        run: |
          $executables = @(
            "dist\registrationscript.exe",
            "dist\registrationscript-api.exe",
            "dist\registrationscript-visible.exe"
          )
          foreach ($executable in $executables) {
            if (!(Test-Path $executable)) {
              Write-Error "$executable not found after build!"
              exit 1
            }
            Write-Host "$executable size: $((Get-Item $executable).length / 1MB) MB"
          }

      - name: Upload full EXEs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-exes
          path: |
            dist/registrationscript.exe
            dist/registrationscript-visible.exe
            dist/registrationscript-api.exe

  # ── Lite build: no ddddocr/onnxruntime, much smaller, manual CAPTCHA only ───
  build-lite:
    name: Build Lite (manual CAPTCHA, smaller)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (lite – no ddddocr)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (lite)
        run: python -m PyInstaller --clean --noconfirm RegistrationBOT-lite.spec

      - name: Verify EXE exists
        run: |
          if (!(Test-Path "dist\registrationscript-lite.exe")) {
            Write-Error "Lite EXE not found after build!"
            exit 1
          }
          Write-Host "Lite EXE size: $((Get-Item 'dist\registrationscript-lite.exe').length / 1MB) MB"

      - name: Upload lite EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lite-exe
          path: dist/registrationscript-lite.exe

  # ── Native macOS builds: Apple Silicon and Intel ────────────────────────────
  build-macos:
    name: Build macOS (${{ matrix.display_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            display_name: Apple Silicon
            asset_suffix: apple-silicon
          - runner: macos-15-intel
            display_name: Intel
            asset_suffix: intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ocr.txt
          pip install pyinstaller

      - name: Build all four macOS executables
        run: |
          for spec in \
            RegistrationBOT.spec \
            RegistrationBOT-lite.spec \
            RegistrationBOT-visible.spec \
            RegistrationBOT-api.spec
          do
            python -m PyInstaller --clean --noconfirm "$spec"
          done

      - name: Verify, sign, and package macOS executables
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          package_dir="RegistrationScript-macos-${ASSET_SUFFIX}"
          mkdir "$package_dir"

          for executable in \
            registrationscript \
            registrationscript-lite \
            registrationscript-visible \
            registrationscript-api
          do
            test -f "dist/$executable"
            chmod +x "dist/$executable"
            codesign --force --sign - "dist/$executable"
            file "dist/$executable"
            cp "dist/$executable" "$package_dir/$executable"
          done

          ditto -c -k --keepParent \
            "$package_dir" \
            "dist/registrationscript-macos-${ASSET_SUFFIX}.zip"
          test -s "dist/registrationscript-macos-${ASSET_SUFFIX}.zip"

      - name: Upload macOS package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.asset_suffix }}
          path: dist/registrationscript-macos-${{ matrix.asset_suffix }}.zip

  # ── Publish: create one GitHub Release with Windows and macOS builds ────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-full, build-lite, build-macos]

    steps:
      - name: Download full EXEs
        uses: actions/download-artifact@v4
        with:
          name: full-exes
          path: release-files

      - name: Download lite EXE
        uses: actions/download-artifact@v4
        with:
          name: lite-exe
          path: release-files

      - name: Download Apple Silicon package
        uses: actions/download-artifact@v4
        with:
          name: macos-apple-silicon
          path: release-files

      - name: Download Intel Mac package
        uses: actions/download-artifact@v4
        with:
          name: macos-intel
          path: release-files

      - name: Calculate release asset sizes
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os

          files = {
              "NORMAL_EXE_SIZE": "release-files/registrationscript.exe",
              "LITE_EXE_SIZE": "release-files/registrationscript-lite.exe",
              "VISIBLE_EXE_SIZE": "release-files/registrationscript-visible.exe",
              "API_EXE_SIZE": "release-files/registrationscript-api.exe",
              "MACOS_ARM64_SIZE": "release-files/registrationscript-macos-apple-silicon.zip",
              "MACOS_INTEL_SIZE": "release-files/registrationscript-macos-intel.zip",
          }

          for env_name, path in files.items():
              size_mb = os.path.getsize(path) / (1024 * 1024)
              print(f"{env_name}={size_mb:.1f} MB")
          PY

      - name: Create GitHub Release and upload Windows and macOS builds
        uses: softprops/action-gh-release@v2
        with:
          name: "RegistrationScript ${{ github.ref_name }}"
          body: |
            ## RegistrationScript ${{ github.ref_name }}

            ### Which download should I pick?

            | File | Size | CAPTCHA | What it does |
            |---|---|---|---|
            | `registrationscript.exe` | ${{ env.NORMAL_EXE_SIZE }} | Automatic OCR + SIS validation | Standard version. Opens Chrome for login and registration monitoring, then submits the selected schedule. |
            | `registrationscript-lite.exe` | ${{ env.LITE_EXE_SIZE }} | Manual entry + SIS validation | Smaller standard version without the OCR model. You type the CAPTCHA shown by SIS. |
            | `registrationscript-visible.exe` | ${{ env.VISIBLE_EXE_SIZE }} | Automatic OCR when continuing; manual when handed off | Visible version. At startup, choose whether Chrome hands control to the student after selecting or continues automatically. |
            | `registrationscript-api.exe` | ${{ env.API_EXE_SIZE }} | Automatic OCR + SIS validation | Direct API version. Uses the SIS HTTP/Ext.NET endpoints without opening Chrome. |
            | `registrationscript-macos-apple-silicon.zip` | ${{ env.MACOS_ARM64_SIZE }} | All four variants | Native package for M1, M2, M3, M4, and newer Apple Silicon Macs. |
            | `registrationscript-macos-intel.zip` | ${{ env.MACOS_INTEL_SIZE }} | All four variants | Native package for Intel-based Macs. |

            ### Quick Start (Windows — no Python needed)
            1. Download one of the four EXEs above to a normal writable folder.
            2. Double-click the EXE (or run it from a terminal).
            3. The first run asks for your SIS Student ID and password and saves them locally for later runs.

            ### Quick Start (macOS — no Python needed)
            1. In the Apple menu, choose **About This Mac** and download the ZIP matching Apple Silicon or Intel.
            2. Extract the ZIP, open Terminal in the extracted folder, and run a variant such as `./registrationscript-visible`.
            3. These builds are ad-hoc signed rather than Apple-notarized, so macOS may require approval in **System Settings → Privacy & Security** the first time.

            **Runtime requirement:** Windows 10/11 or macOS 15+, plus internet access to SIS. The normal, lite, and visible versions require Google Chrome; the direct API version does not open Chrome. Python and pip are not required.

            ### What's new
            See the [commit history](../../commits/${{ github.ref_name }}) for details.

            > **Disclaimer:** Use only on accounts you are authorised to access and in compliance with your institution's policies.
          files: |
            release-files/registrationscript.exe
            release-files/registrationscript-lite.exe
            release-files/registrationscript-visible.exe
            release-files/registrationscript-api.exe
            release-files/registrationscript-macos-apple-silicon.zip
            release-files/registrationscript-macos-intel.zip
          draft: false
          prerelease: false
